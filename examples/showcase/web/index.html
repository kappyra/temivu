<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Try Temivu's widgets, motion, and glass in your browser.">
        <meta name="theme-color" content="#fcfcfd">
        <title>Temivu Showcase</title>
        <link rel="icon" href="./temivu.png" type="image/png">
        <link rel="stylesheet" href="./showcase.css">
        <script type="module" src="./showcase.js"></script>
    </head>
    <body>
        <main>
            <canvas id="showcase" aria-label="Temivu Showcase"></canvas>
            <section id="startup" aria-label="Showcase startup">
                <p id="status" role="status">Enable JavaScript to open the interactive demo.</p>
                <button id="retry" hidden>Try again</button>
            </section>
        </main>
    </body>
</html>
