name: Bug report
description: Something behaves incorrectly or unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do not use this form
        for security vulnerabilities — see SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Commit hash, tag or branch you tested.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the actual behaviour, with steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Rust version, egui/eframe version, desktop/Wayland/X11 and zoom.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, logs, minimal code or a comparison with upstream Forui.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
