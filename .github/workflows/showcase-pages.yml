name: Showcase website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temivu-showcase-pages
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: '1.99.0'
  CARGO_INCREMENTAL: '0'

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Rust and wasm-bindgen
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown
          cli="wasm-bindgen-0.2.129-x86_64-unknown-linux-musl"
          archive="$RUNNER_TEMP/$cli.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/$cli.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' '82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/$cli" >> "$GITHUB_PATH"
      - name: Build and package the website
        env:
          CARGO_PROFILE_RELEASE_STRIP: debuginfo
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=. --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=$(rustc --print sysroot)=/rust"
          cargo build --locked --release --features demo --example showcase --target wasm32-unknown-unknown
          site="$RUNNER_TEMP/showcase-site"
          mkdir -p "$site/pkg"
          cp examples/showcase/web/index.html examples/showcase/web/showcase.css examples/showcase/web/showcase.js "$site/"
          cp branding/temivu-mark-512.png "$site/temivu.png"
          wasm-bindgen target/wasm32-unknown-unknown/release/examples/showcase.wasm \
            --target web --out-dir "$site/pkg" --out-name showcase --no-typescript \
            --remove-name-section --remove-producers-section
          python3 examples/showcase/notices.py "$site/licenses" wasm32-unknown-unknown
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/showcase-site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Showcase
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
