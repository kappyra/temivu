name: Showcase builds

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/showcase.yml'
      - '.gitattributes'
      - 'Cargo.*'
      - 'src/**'
      - 'examples/**'
      - 'branding/**'
      - 'third_party/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: '1.99.0'
  CARGO_INCREMENTAL: '0'

jobs:
  desktop:
    name: ${{ matrix.platform }} Showcase (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - platform: Windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            arch: x86_64
          - platform: macOS
            runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - platform: macOS
            runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_ARCH: ${{ matrix.arch }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libwayland-dev libxkbcommon-dev
      - name: Build
        shell: bash
        run: |
          workspace=$(pwd -W 2>/dev/null || pwd)
          export RUSTFLAGS="--remap-path-prefix=$workspace=. --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          cargo build --locked --release --features demo --example showcase --target "$BUILD_TARGET"
      - name: Package Linux build
        if: runner.os == 'Linux'
        run: |
          python3 examples/showcase/notices.py package/licenses "$BUILD_TARGET"
          install -m 755 "target/$BUILD_TARGET/release/examples/showcase" package/temivu-showcase
          tar -C package -czf temivu-showcase-linux-x86_64.tar.gz .
      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python examples/showcase/notices.py package/licenses $env:BUILD_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "target/$env:BUILD_TARGET/release/examples/showcase.exe" package/temivu-showcase.exe
          Compress-Archive -Path package/* -DestinationPath temivu-showcase-windows-x86_64.zip
      - name: Package and verify macOS disk image
        if: runner.os == 'macOS'
        run: bash examples/showcase/macos/package.sh "$BUILD_TARGET" "$BUILD_ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: temivu-showcase-${{ matrix.platform }}-${{ matrix.arch }}
          path: temivu-showcase-*
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android Showcase
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Rust and Android SDK
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add aarch64-linux-android x86_64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-34' 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - name: Build and verify APK
        run: |
          keystore="$RUNNER_TEMP/temivu-debug.keystore"
          keytool -genkeypair -keystore "$keystore" -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=. --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          python3 examples/showcase/android/package.py temivu-showcase-android.apk --keystore "$keystore"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: temivu-showcase-android
          path: temivu-showcase-android.apk
          if-no-files-found: error
          retention-days: 30
