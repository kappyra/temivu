name: Showcase builds

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/showcase.yml'
      - 'Cargo.*'
      - 'src/**'
      - 'examples/**'
      - 'branding/**'
      - 'third_party/**'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: '1.99.0'
  CARGO_INCREMENTAL: '0'

jobs:
  desktop:
    name: ${{ matrix.platform }} Showcase
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: Windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      BUILD_TARGET: ${{ matrix.target }}
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev
      - name: Build
        shell: bash
        run: |
          workspace=$(pwd -W 2>/dev/null || pwd)
          export RUSTFLAGS="--remap-path-prefix=$workspace=. --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          cargo build --locked --release --features demo --example showcase --target "$BUILD_TARGET"
      - name: Package Linux build
        if: runner.os == 'Linux'
        run: |
          python3 examples/showcase/notices.py package/licenses "$BUILD_TARGET"
          install -m 755 "target/$BUILD_TARGET/release/examples/showcase" package/temivu-showcase
          tar -C package -czf temivu-showcase-linux-x86_64.tar.gz .
      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python examples/showcase/notices.py package/licenses $env:BUILD_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "target/$env:BUILD_TARGET/release/examples/showcase.exe" package/temivu-showcase.exe
          Compress-Archive -Path package/* -DestinationPath temivu-showcase-windows-x86_64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: temivu-showcase-${{ matrix.platform }}-x86_64
          path: temivu-showcase-*
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android Showcase
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Rust and Android SDK
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add aarch64-linux-android x86_64-linux-android
          sdkmanager --install 'platforms;android-34' 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - name: Build and verify APK
        run: |
          keystore="$RUNNER_TEMP/temivu-debug.keystore"
          keytool -genkeypair -keystore "$keystore" -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=. --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo"
          python3 examples/showcase/android/package.py temivu-showcase-android.apk --keystore "$keystore"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: temivu-showcase-android
          path: temivu-showcase-android.apk
          if-no-files-found: error
          retention-days: 30
