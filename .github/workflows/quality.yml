# Quality, dependency, and secret checks.
#
# The dependency-audit job is expected to fail until the upstream AccessKit and
# AT-SPI stack moves to zbus 6: the three unsuppressed informational advisories
# are documented in docs/DEPENDENCY_ADVISORIES.md. It runs as a separate job
# with continue-on-error so it still reports its findings without masking the
# format, compile, lint, test, and documentation results.
name: Rust quality and security
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +1.99.0 fmt --check
      - name: Compile
        run: cargo +1.99.0 check --locked --all-features
      - name: Lint
        run: cargo +1.99.0 clippy --locked --all-targets --all-features -- -D warnings
      - name: Install nextest
        run: cargo +1.99.0 install cargo-nextest --version 0.9.150 --locked
      - name: Run tests
        run: cargo +1.99.0 nextest run --locked --all-features
      - name: Run documentation tests
        run: cargo +1.99.0 test --locked --doc --all-features
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up the declared minimum toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Compile at the declared minimum Rust version
        run: cargo +1.95.0 check --locked --all-features
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install dependency auditor
        run: cargo +1.99.0 install cargo-deny --version 0.20.2 --locked
      - name: Audit dependencies
        run: cargo +1.99.0 deny check
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.28.0
      - name: Scan Git history
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --exit-code 1 .
