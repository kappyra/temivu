[graph]
all-features = true

[advisories]
ignore = []

[licenses]
# These licenses are permitted for dependencies, not relicensed as MIT.
# Font notices and all distribution obligations require separate review.
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "Zlib", "Unicode-3.0", "OFL-1.1", "Ubuntu-font-1.0", "BSL-1.0", "ISC"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
